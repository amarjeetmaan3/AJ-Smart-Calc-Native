name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Save App Signature (Cache)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: aj-smart-keystore

      - name: Auto-Update App Version
        run: |
          sed -i 's/versionCode = 1/versionCode = ${{ github.run_number }}/g' app/build.gradle.kts || true
          sed -i 's/versionName = "1.0"/versionName = "1.${{ github.run_number }}"/g' app/build.gradle.kts || true

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Search and Rescue Files
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -exec cp {} apk_output/ \;
          ls -R > apk_output/folder_structure_log.txt

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AJ-Build-Results
          path: apk_output/
